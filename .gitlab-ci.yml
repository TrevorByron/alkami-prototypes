stages:
  - deploy

pages:
  stage: deploy
  image: node:22
  script:
    - npm ci
    - npm run build
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-functions:
  stage: deploy
  image: node:22
  script:
    - npx supabase functions deploy check-embed --project-ref "$SUPABASE_PROJECT_REF"
    - npx supabase functions deploy slack-directory --project-ref "$SUPABASE_PROJECT_REF"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
